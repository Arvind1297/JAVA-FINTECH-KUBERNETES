apiVersion: networking.k8s.io/v1
kind: Ingress
  name: banking-Ingress
  namespace: banking
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target:/

spec: 
  rules:
    - host: bank.mymorena.xyz
      http: 
        paths:
          - path: /
            pathtype: Prefix
            backend:
              service:
                name: frontend-svc 
                port:
                  number: 80

    - host: bank.mymorena.xyz
      http: 
        paths:
          - path: /
            pathtype: Prefix
            backend:
              service:
                name: frontend-svc 
                port:
                  number: 80
    - host: api.bank.mymorena.xyz
      http: 
        paths:
          - path: /
            pathtype: Prefix
            backend:
              service:
                name: backend-svc 
                port:
                  number: 8080                                     
        -