server:
  port: 8080

spring:
  application:
    name: ledgerline-banking

  datasource:
    url: jdbc:postgresql://localhost:5432/bankingdb
    username: banking_user
    password: banking_pass123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  sql:
    init:
      mode: always

app:
  jwt:
    secret: "3f8b9c1a7d2e4f6091b8c3a5d7e9f1023f8b9c1a7d2e4f6091b8c3a5d7e9f102"
    expiration-ms: 86400000   # 24 hours

logging:
  level:
    org.hibernate.SQL: WARN
    com.bank.banking: INFO